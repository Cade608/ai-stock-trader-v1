<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Stock V1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
<header>
  <h1>
    AI STOCK
    <span>V1</span>
  </h1>
  <p>美股 AI 智能分析</p>
</header>
<!-- 股票搜索 -->
<section class="search-box">
  <input
    id="ticker"
    type="text"
    placeholder="输入股票代码，例如 NVDA"
    value="AAPL"
  >
  <button id="analyze">
    分析
  </button>
</section>
<!-- 状态 -->
<div id="status">
  准备就绪
</div>
<!-- 股票结果 -->
<section id="result" class="hidden">
  <div class="stock-card">
    <div>
      <h2 id="name">
        Apple Inc.
      </h2>
      <p id="symbol">
        AAPL
      </p>
    </div>
    <div class="price-area">
      <strong id="price">
        --
      </strong>
      <p id="change">
        --
      </p>
    </div>
  </div>
  <!-- 指标 -->
  <div class="metrics">
    <div class="metric">
      <span>
        RSI 14
      </span>
      <strong id="rsi">
        --
      </strong>
    </div>
    <div class="metric">
      <span>
        SMA 20
      </span>
      <strong id="sma20">
        --
      </strong>
    </div>
    <div class="metric">
      <span>
        SMA 50
      </span>
      <strong id="sma50">
        --
      </strong>
    </div>
    <div class="metric">
      <span>
        数据点
      </span>
      <strong id="points">
        --
      </strong>
    </div>
  </div>
  <!-- AI 分析 -->
  <div class="ai-card">
    <h2>
      🤖 AI 分析
    </h2>
    <div id="signal">
      --
    </div>
    <p id="summary">
      --
    </p>
    <div class="analysis">
      <div>
        <span>
          趋势
        </span>
        <strong id="trend">
          --
        </strong>
      </div>
      <div>
        <span>
          动能
        </span>
        <strong id="momentum">
          --
        </strong>
      </div>
      <div>
        <span>
          风险
        </span>
        <strong id="risk">
          --
        </strong>
      </div>
    </div>
  </div>
  <!-- 图表 -->
  <div class="chart-card">
    <h2>
      📈 价格走势
    </h2>
    <canvas id="chart"></canvas>
  </div>
</section>
<footer>
  AI Stock V1 仅供学习与演示，
  不构成投资建议。
</footer>
  </div>
  <!-- JavaScript -->
 <script>
document.addEventListener("DOMContentLoaded", function () {

  const input = document.getElementById("ticker");
  const button = document.getElementById("analyze");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  button.onclick = function () {

    const symbol = input.value.trim().toUpperCase();

    if (!symbol) {
      status.textContent = "请输入股票代码";
      return;
    }

    status.textContent = "正在分析 " + symbol + "...";

    setTimeout(function () {

      document.getElementById("name").textContent =
        symbol + " Stock";

      document.getElementById("symbol").textContent =
        symbol;

      document.getElementById("price").textContent =
        "$100.00";

      document.getElementById("change").textContent =
        "+2.35%";

      document.getElementById("rsi").textContent =
        "58.4";

      document.getElementById("sma20").textContent =
        "$98.20";

      document.getElementById("sma50").textContent =
        "$94.70";

      document.getElementById("points").textContent =
        "90";

      document.getElementById("signal").textContent =
        "偏强";

      document.getElementById("trend").textContent =
        "上升";

      document.getElementById("momentum").textContent =
        "较强";

      document.getElementById("risk").textContent =
        "中等";

      document.getElementById("summary").textContent =
        symbol + " 当前技术指标显示趋势偏强。" +
        "目前为 V1 演示数据。";

      result.classList.remove("hidden");

      status.textContent = "分析完成";

    }, 500);

  };

});
</script>
</body>
</html>
